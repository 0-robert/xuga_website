# Deploys to Vercel production on every push to build/towel-tales.
#
# Triggered by:
# - Developer pushes (git push)
# - Sveltia CMS commits (editors clicking Publish at /admin/)
#
# Why this exists: the Vercel project is not connected to GitHub via the
# Vercel GitHub App, so pushes do not auto-deploy. This workflow is the
# bridge until (or instead of) wiring up that integration.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       Personal token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      team_9tIQbuhxkuKV9sfM7NKF5oXG
#   VERCEL_PROJECT_ID  prj_OMyVpwgmHOBhmxTaUSjwxKGhj5qL

name: Deploy to Vercel (production)

on:
  push:
    branches: [build/towel-tales]
  # Allows manual re-runs from the Actions tab.
  workflow_dispatch:

# One in-flight deploy at a time. Newer pushes cancel the previous run so
# the live site always reflects the latest commit, not whichever finished
# first.
concurrency:
  group: vercel-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
