<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Encode XUGA admin token</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 5vh auto; padding: 0 1.5rem; color: #1a1a2e; }
      h1 { margin: 0 0 0.25rem; }
      input, textarea {
        width: 100%; padding: 0.6rem 0.75rem; box-sizing: border-box;
        font-family: ui-monospace, SF Mono, Menlo, monospace; font-size: 0.9rem;
        border: 1px solid #ccc; border-radius: 6px;
      }
      label { display: block; margin: 1rem 0 0.3rem; font-weight: 600; font-size: 0.9rem; }
      button { margin-top: 1rem; padding: 0.7rem 1.4rem; border: 0; border-radius: 6px; background: #1a1a2e; color: #fff; font-size: 0.95rem; cursor: pointer; }
      pre {
        background: #f4f4f4; padding: 1rem; border-radius: 6px;
        overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all;
      }
      .warn { color: #c63b3b; font-size: 0.9rem; }
      .ok   { color: #2d8a4f; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Encode admin token</h1>
    <p class="warn">
      Run this locally only (e.g. <code>npm run dev</code> → open this page).
      Paste the output into the <code>E = { ... }</code> block in
      <code>public/admin/index.html</code>, then <b>delete this file</b> before
      committing/deploying.
    </p>

    <label>Editor password</label>
    <input id="pw" type="text" value="" />

    <label>GitHub PAT (starts with <code>ghp_</code> or <code>github_pat_</code>)</label>
    <input id="tok" type="text" placeholder="ghp_…" autocomplete="off" />

    <button id="go">Encode</button>
    <p id="status"></p>

    <label>Paste this into <code>public/admin/index.html</code></label>
    <pre id="out">(output will appear here)</pre>

    <script type="module">
      const enc = new TextEncoder();

      const b64 = (buf) => {
        const a = new Uint8Array(buf);
        let s = '';
        for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
        return btoa(s);
      };
      const hex = (buf) => {
        const a = new Uint8Array(buf);
        let o = '';
        for (let i = 0; i < a.length; i++) o += a[i].toString(16).padStart(2, '0');
        return o;
      };

      async function deriveKey(password, salt) {
        const baseKey = await crypto.subtle.importKey(
          'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false, ['encrypt']
        );
      }

      document.getElementById('go').addEventListener('click', async () => {
        const status = document.getElementById('status');
        const out = document.getElementById('out');
        const password = document.getElementById('pw').value;
        const token = document.getElementById('tok').value.trim();
        if (!password) { status.className = 'warn'; status.textContent = 'Password required.'; return; }
        if (!/^(ghp_|github_pat_)/.test(token)) {
          status.className = 'warn';
          status.textContent = 'Token must start with ghp_ or github_pat_.';
          return;
        }
        status.className = 'warn';
        status.textContent = 'Encrypting (600k PBKDF2 iterations, ~1s)…';

        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(password, salt);
        const ct = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          enc.encode(token)
        );
        const h = await crypto.subtle.digest('SHA-256', enc.encode(token));

        const block = [
          "var E = {",
          "  s: '" + b64(salt) + "',",
          "  i: '" + b64(iv) + "',",
          "  c: '" + b64(ct) + "',",
          "  h: '" + hex(h) + "'",
          "};"
        ].join('\n');

        out.textContent = block;
        status.className = 'ok';
        status.textContent = 'Done. Copy the block above into public/admin/index.html, then delete this file.';
      });
    </script>
  </body>
</html>
